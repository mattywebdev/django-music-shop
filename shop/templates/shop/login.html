{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<section class="auth-page auth-page--login">
    <div class="auth-card">
        <div class="auth-card-head">
            <p>Welcome back</p>
            <h1>Login</h1>
        </div>

        {% if auth_messages %}
            <div class="auth-messages">
                {% for message in auth_messages %}
                    <div class="auth-message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="auth-field">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" autocomplete="username" required>
            </div>

            <div class="auth-field">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="auth-submit-btn">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                <span>Login</span>
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="{% url 'register' %}">Create one</a>
        </p>
    </div>
</section>
{% endblock %}
